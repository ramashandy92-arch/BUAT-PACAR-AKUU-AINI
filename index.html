
<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>I Love You Sayang ❤️</title>

<style>
@import url('https://fonts.googleapis.com/css2?family=Great+Vibes&family=Poppins:wght@400;600&display=swap');

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    height: 100vh;
    overflow: hidden;
    background: linear-gradient(135deg, #1a0618, #4a1237, #16081f);
    font-family: 'Poppins', sans-serif;
}

/* Bintang */
#stars {
    position: fixed;
    inset: 0;
    pointer-events: none;
}

.star {
    position: absolute;
    background: white;
    border-radius: 50%;
    animation: twinkle 2s infinite alternate;
}

@keyframes twinkle {
    from { opacity: .2; }
    to { opacity: 1; }
}

/* HALAMAN BUKA */
.opening {
    position: fixed;
    inset: 0;
    z-index: 10;
    display: flex;
    justify-content: center;
    align-items: center;
    flex-direction: column;
    background: radial-gradient(circle, #571d45, #1b0920, #080510);
    transition: 1s;
}

.opening.hide {
    opacity: 0;
    transform: scale(1.5);
    pointer-events: none;
}

.envelope {
    font-size: 100px;
    animation: pulse 1.5s infinite;
    filter: drop-shadow(0 0 25px #ff4d9b);
}

.open-text {
    margin-top: 25px;
    font-family: 'Great Vibes', cursive;
    color: #ffc5e0;
    font-size: 55px;
    text-shadow: 0 0 20px #ff4d9b;
}

.open-button {
    margin-top: 25px;
    padding: 13px 35px;
    background: linear-gradient(45deg, #ff4d88, #ff9bc7);
    border: none;
    border-radius: 50px;
    color: white;
    font-size: 17px;
    cursor: pointer;
    box-shadow: 0 0 25px #ff4d88;
    transition: .3s;
}

.open-button:hover {
    transform: scale(1.1);
}

@keyframes pulse {
    0%, 100% { transform: scale(1); }
    50% { transform: scale(1.15); }
}

/* HALAMAN UTAMA */
.main {
    position: absolute;
    inset: 0;
    display: flex;
    justify-content: center;
    align-items: center;
    flex-direction: column;
    text-align: center;
    opacity: 0;
    transition: 2s;
    z-index: 2;
}

.main.show {
    opacity: 1;
}

.big-heart {
    font-size: 100px;
    animation: heartbeat 1.2s infinite;
    filter: drop-shadow(0 0 25px #ff4088);
}

@keyframes heartbeat {
    0%, 100% { transform: scale(1); }
    25% { transform: scale(1.2); }
    40% { transform: scale(1); }
    60% { transform: scale(1.15); }
}

.title {
    margin-top: 20px;
    font-family: 'Great Vibes', cursive;
    font-size: 75px;
    color: #ffc4df;
    text-shadow: 0 0 20px #ff4d9b;
}

.subtitle {
    margin-top: 10px;
    font-size: 25px;
    letter-spacing: 8px;
    color: white;
    text-shadow: 0 0 15px pink;
}

/* LOVE BERTERBANG */
.love {
    position: fixed;
    z-index: 3;
    pointer-events: none;
    animation: fly linear forwards;
}

@keyframes fly {
    0% {
        transform: translateY(0) scale(.3) rotate(0deg);
        opacity: 0;
    }
    15% {
        opacity: 1;
        transform: scale(1);
    }
    100% {
        transform: translateY(-110vh) rotate(360deg);
        opacity: 0;
    }
}

/* Ledakan love */
.burst {
    position: fixed;
    left: 50%;
    top: 50%;
    pointer-events: none;
    z-index: 5;
    animation: explode 2.5s ease-out forwards;
}

@keyframes explode {
    0% {
        transform: translate(-50%, -50%) scale(0);
        opacity: 0;
    }
    20% {
        transform: translate(-50%, -50%) scale(1.3);
        opacity: 1;
    }
    100% {
        transform: translate(
            calc(-50% + var(--x)),
            calc(-50% + var(--y))
        ) scale(1);
        opacity: 0;
    }
}

/* HP */
@media(max-width:600px) {
    .envelope {
        font-size: 80px;
    }

    .open-text {
        font-size: 45px;
    }

    .big-heart {
        font-size: 80px;
    }

    .title {
        font-size: 55px;
    }

    .subtitle {
        font-size: 19px;
        letter-spacing: 5px;
    }
}
</style>
</head>

<body>

<div id="stars"></div>

<!-- PEMBUKA -->
<div class="opening" id="opening">

    <div class="envelope">💌</div>

    <div class="open-text">For You</div>

    <button class="open-button" onclick="openGift()">
        BUKA ❤️
    </button>

</div>

<!-- ISI -->
<div class="main" id="main">

    <div class="big-heart">❤️</div>

    <div class="title">I Love You</div>

    <div class="subtitle">SAYANG</div>

</div>

<script>

// Membuat bintang
const stars = document.getElementById("stars");

for(let i = 0; i < 100; i++) {
    const star = document.createElement("div");

    star.className = "star";

    const size = Math.random() * 3 + 1;

    star.style.width = size + "px";
    star.style.height = size + "px";
    star.style.left = Math.random() * 100 + "%";
    star.style.top = Math.random() * 100 + "%";
    star.style.animationDelay = Math.random() * 3 + "s";

    stars.appendChild(star);
}

// Emoji love
const emojis = ["❤️", "💖", "💕", "💗", "💘", "💝", "🩷", "💓"];

// Membuat love meledak
function explosion() {

    for(let i = 0; i < 150; i++) {

        const heart = document.createElement("div");

        heart.className = "burst";

        heart.innerHTML =
            emojis[Math.floor(Math.random() * emojis.length)];

        heart.style.fontSize =
            (15 + Math.random() * 35) + "px";

        heart.style.setProperty(
            "--x",
            (Math.random() * window.innerWidth - window.innerWidth / 2) + "px"
        );

        heart.style.setProperty(
            "--y",
            (Math.random() * window.innerHeight - window.innerHeight / 2) + "px"
        );

        document.body.appendChild(heart);

        setTimeout(() => heart.remove(), 3000);
    }
}

// Love beterbangan
function createLove() {

    const heart = document.createElement("div");

    heart.className = "love";

    heart.innerHTML =
        emojis[Math.floor(Math.random() * emojis.length)];

    heart.style.left = Math.random() * 100 + "vw";
    heart.style.bottom = "-50px";

    heart.style.fontSize =
        (20 + Math.random() * 35) + "px";

    heart.style.animationDuration =
        (3 + Math.random() * 5) + "s";

    document.body.appendChild(heart);

    setTimeout(() => heart.remove(), 9000);
}

// Tombol buka
function openGift() {

    document.getElementById("opening").classList.add("hide");

    document.getElementById("main").classList.add("show");

    // Love meledak saat dibuka
    explosion();

    // Love langsung memenuhi layar
    for(let i = 0; i < 100; i++) {
        setTimeout(createLove, i * 30);
    }

    // Love terus bermunculan
    setInterval(createLove, 150);
}

</script>

</body>
</html>
